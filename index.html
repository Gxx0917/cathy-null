<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cathy.null | Game Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #eee;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 60px;
            border-bottom: 1px solid #222;
            padding-bottom: 40px;
        }
        h1 {
            font-size: 48px;
            letter-spacing: 4px;
            color: #fff;
            margin-bottom: 10px;
        }
        .tagline {
            font-size: 16px;
            color: #888;
            letter-spacing: 1px;
        }
        section {
            margin-bottom: 80px;
        }
        h2 {
            font-size: 20px;
            letter-spacing: 2px;
            color: #ccc;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .work-item {
            background: #111;
            border-radius: 4px;
            overflow: hidden;
            transition: opacity 0.3s;
        }
        .work-item:hover {
            opacity: 0.8;
        }
        .work-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .about, .contact {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            color: #aaa;
        }
        .contact a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }
        .contact a:hover {
            color: #888;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>cathy.null</h1>
            <p class="tagline">Game Art / Concept / UI</p>
        </header>

        <section class="works">
            <h2>Works</h2>
            <div class="grid">
                <!-- 替换为你的作品图 -->
                <div class="work-item"><img src="https://via.placeholder.com/400x300/111/eee?text=Character" alt="Character"></div>
                <div class="work-item"><img src="https://via.placeholder.com/400x300/111/eee?text=Environment" alt="Environment"></div>
                <div class="work-item"><img src="https://via.placeholder.com/400x300/111/eee?text=Game+UI" alt="Game UI"></div>
                <div class="work-item"><img src="https://via.placeholder.com/400x300/111/eee?text=Concept" alt="Concept"></div>
            </div>
        </section>

        <section class="about">
            <h2>About</h2>
            <p>Game Artist / Concept Designer focused on dark, minimalist, and atmospheric visuals. Skilled in character, environment, and UI design for games.</p>
        </section>

        <section class="contact">
            <h2>Contact</h2>
            <p>
                <a href="mailto:your@email.com">Email</a>
                <a href="#">ArtStation</a>
                <a href="#">Behance</a>
            </p>
        </section>
    </div>
    <footer>© 2026 cathy.null</footer>
</body>
</html>
